[project]
name = "flet-paypal-payment"
version = "0.1.0"
description = "PayPal checkout for Flet apps, wrapping the flutter_paypal_payment Flutter package."
readme = "README.md"
authors = [{ name = "Flet contributors", email = "hello@flet.dev" }]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "flet >=0.86.4",
]

[project.urls]
Homepage = "https://flet.dev"
Repository = "https://github.com/flet-dev/flet-paypal-payment"
Issues = "https://github.com/flet-dev/flet-paypal-payment/issues"

[tool.setuptools.package-data]
"flutter.flet_paypal_payment" = ["**/*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
